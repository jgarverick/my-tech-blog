<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title description">
  <title id="title">FinOps practice map</title>
  <desc id="description">Engineering, finance, technology, and business collaborate around spending data to create cost awareness, containment, and accountability. Proactive tools include budgets, alerts, and utilization profiles. Reactive tools include automation and consumption API reporting. Infrastructure as Code can make budgets repeatable.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#475569" />
    </marker>
  </defs>
  <rect width="1000" height="650" rx="8" fill="#f8fafc" />
  <text x="36" y="48" fill="#0f172a" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">FinOps: shared data, deliberate decisions</text>

  <rect x="36" y="82" width="928" height="135" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <text x="60" y="118" fill="#1e3a8a" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">COLLABORATION AROUND SPENDING DATA</text>
  <rect x="60" y="140" width="190" height="52" rx="6" fill="#ffffff" stroke="#93c5fd" />
  <text x="155" y="173" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, sans-serif" font-size="17">Engineering</text>
  <rect x="280" y="140" width="160" height="52" rx="6" fill="#ffffff" stroke="#93c5fd" />
  <text x="360" y="173" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, sans-serif" font-size="17">Finance</text>
  <rect x="470" y="140" width="190" height="52" rx="6" fill="#ffffff" stroke="#93c5fd" />
  <text x="565" y="173" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, sans-serif" font-size="17">Technology</text>
  <rect x="690" y="140" width="240" height="52" rx="6" fill="#ffffff" stroke="#93c5fd" />
  <text x="810" y="173" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, sans-serif" font-size="17">Business</text>

  <path d="M500 217V246" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="36" y="258" width="928" height="100" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
  <text x="60" y="294" fill="#166534" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">COMMON USE CASES</text>
  <text x="60" y="330" fill="#334155" font-family="Segoe UI, sans-serif" font-size="18">Cost awareness</text>
  <circle cx="248" cy="324" r="4" fill="#16a34a" />
  <text x="270" y="330" fill="#334155" font-family="Segoe UI, sans-serif" font-size="18">Cost containment</text>
  <circle cx="468" cy="324" r="4" fill="#16a34a" />
  <text x="490" y="330" fill="#334155" font-family="Segoe UI, sans-serif" font-size="18">Team accountability and chargebacks</text>

  <rect x="36" y="396" width="445" height="150" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2" />
  <text x="60" y="432" fill="#9a3412" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">PROACTIVE</text>
  <text x="60" y="470" fill="#334155" font-family="Segoe UI, sans-serif" font-size="17">Budgets and alerts</text>
  <text x="60" y="503" fill="#334155" font-family="Segoe UI, sans-serif" font-size="17">Utilization profiles</text>

  <rect x="519" y="396" width="445" height="150" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="2" />
  <text x="543" y="432" fill="#9d174d" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">REACTIVE</text>
  <text x="543" y="470" fill="#334155" font-family="Segoe UI, sans-serif" font-size="17">Automate service disablement</text>
  <text x="543" y="503" fill="#334155" font-family="Segoe UI, sans-serif" font-size="17">Report from consumption APIs</text>

  <rect x="36" y="572" width="928" height="48" rx="6" fill="#e2e8f0" />
  <text x="60" y="603" fill="#0f172a" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Codify budget guardrails with ARM, Bicep, or Terraform.</text>
</svg>